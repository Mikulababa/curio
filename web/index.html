<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3efe6">
  <meta name="color-scheme" content="light">
  <meta name="description" content="拾趣：不猜你喜欢，也不刻意回避你。一本可以随手翻的网络杂志。">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="./styles.css">
  <title>拾趣 · 下一页会是什么</title>
</head>
<body>
  <div class="layout">
    <aside class="aside" aria-label="拾趣简介">
      <div>
        <div class="overline">A SMALL MAGAZINE FOR THE CURIOUS</div>
        <div class="logo">拾趣<span>.</span></div>
        <p class="tagline">下一页会是什么？<br>随便翻翻就好。</p>
      </div>
      <p class="aside-footer">不猜你喜欢，也不刻意避开你。<br>从不同来源遇见新的事情。<br><br>不设阅读任务，不记录你的兴趣画像。</p>
    </aside>

    <main class="reader">
      <header class="mobile-header">
        <div class="mobile-logo">拾趣<span>.</span></div>
        <div class="mobile-note">下一页会是什么？</div>
      </header>
      <section class="card" aria-label="文章阅读器" id="readerCard">
        <div class="card-head">
          <span class="eyebrow">拾趣 / 随手翻翻</span>
          <nav aria-label="阅读模式" class="nav">
            <button type="button" id="browseMode" class="nav-link selected" aria-pressed="true">发现</button>
            <button type="button" id="savedMode" class="nav-link" aria-pressed="false">收藏</button>
          </nav>
        </div>
        <div class="divider"></div>
        <div class="visual" id="visual">
          <div id="illustration" class="illustration" aria-hidden="true">
            <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="1.5" role="presentation">
              <circle cx="60" cy="60" r="46"/><ellipse cx="60" cy="60" rx="19" ry="46"/><path d="M14 60h92M24 36h72M24 84h72M60 14v92"/>
            </svg>
          </div>
          <img id="cover" alt="" referrerpolicy="no-referrer" hidden>
        </div>
        <article class="article" id="article" aria-live="polite">
          <div class="meta"><span id="topic">正在翻开新的一页</span><span id="date"></span></div>
          <h1 id="title">下一页会是什么？</h1>
          <p class="summary" id="summary">正在获取公开订阅源中的文章……</p>
          <p class="translation-note" id="translationNote" hidden></p>
          <div class="article-foot">
            <span class="source" id="source"></span>
            <button type="button" class="original-toggle" id="originalToggle" hidden>查看原标题</button>
            <div class="original-title" id="originalTitle" hidden>
              <p id="originalTitleText"></p>
              <p id="originalSummaryText"></p>
            </div>
          </div>
        </article>
        <div class="controls">
          <button type="button" class="primary" id="nextButton">下一篇 <span aria-hidden="true">→</span></button>
          <a class="outline" id="openButton" target="_blank" rel="noopener noreferrer">读原文 ↗</a>
          <button type="button" class="icon-button" id="saveButton" aria-label="收藏这篇文章" aria-pressed="false" title="收藏文章">☆</button>
          <button type="button" class="icon-button" id="backButton" aria-label="上一篇" title="上一篇">←</button>
        </div>
      </section>
      <div class="status-line" role="status" id="statusLine"></div>
      <div class="hint">向上滑动或按 ↓ 阅读下一篇 · 随时可以离开</div>
      <div class="footer-actions"><button type="button" id="reloadButton">重新检查文章</button><a href="./experiment.html">标题盲读实验 ↗</a></div>
    </main>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
